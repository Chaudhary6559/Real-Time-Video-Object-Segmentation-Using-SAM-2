# Custom Hiera-B Configuration for SAM 2
# Domain-specific preprocessing and augmentation integrated

model:
  _target_: models.custom_hiera_b.CustomHieraBImageEncoder
  
  # Custom Hiera-B Base Encoder
  custom_hiera:
    _target_: models.custom_hiera_b.CustomHieraB
    embed_dim: 112
    num_heads: 2
    drop_path_rate: 0.0
    q_pool: 3
    q_stride: [2, 2]
    stages: [2, 3, 16, 3]  # Hiera-B architecture
    dim_mul: 2.0
    head_mul: 2.0
    window_pos_embed_bkg_spatial_size: [14, 14]
    window_spec: [8, 4, 14, 7]
    global_att_blocks: [12, 16, 20]
    return_interm_layers: true
  
  # Image Encoder Settings
  d_model: 256
  fpn_interp_model: "bilinear"
  fuse_type: "sum"

# Preprocessing Settings
preprocessing:
  target_size: 1024
  fps: 10
  normalize: true
  interpolate_corrupted: true
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

# Augmentation Settings
augmentation:
  # Spatial
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_range: [-15, 15]
  scale_prob: 0.5
  scale_range: [0.8, 1.2]
  
  # Temporal
  frame_dropout_prob: 0.1
  temporal_jitter_range: [-2, 2]
  
  # Appearance/Motion
  brightness_prob: 0.5
  brightness_range: [-0.2, 0.2]
  contrast_prob: 0.5
  contrast_range: [-0.2, 0.2]
  hsv_prob: 0.5
  motion_blur_prob: 0.3
  motion_blur_kernel_range: [3, 7]

# Memory Management
memory:
  memory_size: 64
  keyframe_interval: 5
  similarity_threshold: 0.7

